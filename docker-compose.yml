version: '3.8'
services:
  # Microservicii
  auth-service:
    build: ./auth-service
    ports: ["8081:8080"]
  patient-service:
    build: ./patient-service
    ports: ["8082:8080"]
  doctor-service:
    build: ./doctor-service
    ports: ["8083:8080"]
  appointment-service:
    build: ./appointment-service
    ports: ["8084:8080"]
  medical-records-service:
    build: ./medical-records-service
    ports: ["8085:8080"]
  billing-service:
    build: ./billing-service
    ports: ["8086:8080"]
  notification-service:
    build: ./notification-service
    ports: ["8087:8080"]
  analytics-service:
    build: ./analytics-service
    ports: ["8088:8080"]

  # Baze de date
  db-postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
  db-mongo:
    image: mongo:6.0